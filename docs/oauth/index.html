<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Returning to Marketing Studio…</title>
<style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:560px;margin:12vh auto;padding:0 20px;color:#111827}a{color:#6d28d9}</style>
</head>
<body>
<h2>Returning to Marketing Studio…</h2>
<p id="msg">If nothing happens, make sure Marketing Studio is open on this computer and that you pressed <b>Connect</b> there, then <a id="go" href="#">click here</a>.</p>
<script>
// Sign-in relay. Platforms that insist on an https:// address send the browser here after you
// sign in; this page hands the result to the Marketing Studio app on THIS computer and nowhere
// else. The destination is fixed, so the page cannot be used to send anyone to another site.
// It stores nothing and contacts no server.
(function () {
  var target = 'http://localhost:53682/oauth' + window.location.search;
  document.getElementById('go').href = target;
  if (/[?&](code|error)=/.test(window.location.search)) window.location.replace(target);
  else document.getElementById('msg').textContent = 'This page completes sign-in for the Marketing Studio app. Start from the Auto-post page in the app.';
})();
</script>
</body>
</html>
